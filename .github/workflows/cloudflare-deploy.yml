name: Deploy Cloudflare (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Confirmar deploy para a conta Cloudflare configurada
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: estoqueweb-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/estoqueweb-cloudflare' && inputs.confirm_deploy == true && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate target database and credentials
        env:
          DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$ACCOUNT_ID"
          test -n "$API_TOKEN"
          test "$DATABASE_ID" != "00000000-0000-0000-0000-000000000001"
          grep -Fq "\"database_id\": \"$DATABASE_ID\"" wrangler.jsonc
      - name: Apply additive migrations to the configured D1 database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply estoqueweb --remote
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
