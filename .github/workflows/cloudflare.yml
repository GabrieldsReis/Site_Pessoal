name: Cloudflare storefront

on:
  push:
    branches: ["feature/estoqueweb-cloudflare"]
    paths: ["cloudflare/**", ".github/workflows/cloudflare.yml"]
  pull_request:
    paths: ["cloudflare/**", ".github/workflows/cloudflare.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
