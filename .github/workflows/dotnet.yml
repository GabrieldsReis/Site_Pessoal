name: .NET

on:
  push:
    branches: ["feature/estoqueweb-cosmeticos"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore EstoqueWeb.slnx
      - run: dotnet build EstoqueWeb.slnx --no-restore --configuration Release
      - run: dotnet test EstoqueWeb.slnx --no-build --configuration Release
